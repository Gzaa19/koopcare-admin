version: '3.8'

services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: koopcare_mysql
    restart: always
    environment:
      MYSQL_DATABASE: koopcare_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: koopcare_user
      MYSQL_PASSWORD: koopcarepassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Backend Node.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: koopcare_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=koopcare_user
      - DB_PASSWORD=koopcarepassword
      - DB_NAME=koopcare_db
      - JWT_SECRET=supersecretkoopcarekey
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 3. Frontend React Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: koopcare_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data: